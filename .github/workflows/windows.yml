name: Windows

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
      - '**/*.adoc'
      - '**/*.pdf'
      - docs/**
      - LICENSE*
      - .gitignore
      - .gitattributes
      - .editorconfig
      - .clang-format
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hangon:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Shenmue
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure HangOn
        run: cmake -S src/hangon -B build/hangon -A x64
      - name: Build HangOn
        run: cmake --build build/hangon --config Release --target shenmue_hangon
      - name: Prepare HangOn
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/hangon/Release/ShenmueHangon.exe dist/HangOn.exe
      - name: Sign CI executables
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./.github/scripts/sign-executables.ps1 -Files 'dist/HangOn.exe'
      - name: Attest HangOn
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/HangOn.exe
      - name: Upload HangOn
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HangOn
          path: dist/HangOn.exe
          if-no-files-found: error

  build:
    name: Build Shenmue ${{ matrix.game }}
    needs: hangon
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      matrix:
        game: [1, 2]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Shenmue
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Configure games
        run: ./.github/scripts/configure-games.ps1 -BuildDirectory build/windows-asi
      - name: Build games
        run: cmake --build build/windows-asi --config Release --target shenmue${{ matrix.game }}_asi shenmue${{ matrix.game }} --parallel 4
      - name: Sign CI executables
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./.github/scripts/sign-executables.ps1 -Files @('build/windows-asi/Release/shenmue${{ matrix.game }}e.asi',
            'build/windows-asi/Release/shenmue${{ matrix.game }}.exe')

  data:
    needs: build
    runs-on: [self-hosted, Windows, X64, shenmue-data]
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout Shenmue
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: true
          clean: false
      - name: Check game data
        run: |
          if (!$env:SHEN_STEAM_ROOT) { throw 'SHEN_STEAM_ROOT is not configured' }
          foreach ($game in 'sm1', 'sm2') {
            if (!(Test-Path (Join-Path $env:SHEN_STEAM_ROOT "$game/archives/dx11"))) {
              throw "SHEN_STEAM_ROOT is missing $game/archives/dx11"
            }
          }
          New-Item -ItemType Directory -Force dist/screens | Out-Null
          Get-ChildItem dist/screens -File -Filter '*.png' | Remove-Item -Force
      - name: Configure screen captures
        run: ./.github/scripts/configure-games.ps1 -BuildDirectory build/windows-capture -Capture
      - name: Build tools and round-trip scenarios
        id: roundtrip
        run: ./.github/scripts/roundtrip-scn3.ps1
      - name: Build screen captures
        run: cmake --build build/windows-capture --config Release --target shenmue1 shenmue2 --parallel 4
      - name: Build HangOn capture
        run: |
          cmake -S src/hangon -B build/hangon-capture -A x64 -DSHEN_AUTO_TEST_ENABLED=ON
          if ($LASTEXITCODE -ne 0) { throw 'HangOn capture configuration failed' }
          cmake --build build/hangon-capture --config Release --target shenmue_hangon
      - name: Capture screens
        run: ./.github/scripts/capture-screens.ps1
      - name: Upload screens
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: screens
          path: dist/screens/*.png
          if-no-files-found: error
      - name: Compare HangOn screenshot
        run: ./.github/scripts/compare-hangon-screenshot.ps1
      - name: Sync scenarios and roundtrip badge
        if: always() && !cancelled() && (steps.roundtrip.outcome == 'success' || steps.roundtrip.outcome == 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          SCN3_SYNC_SOURCES: ${{ job.status == 'success' }}
        run: ./.github/scripts/sync-scn3.ps1 -IncludeSources:($env:SCN3_SYNC_SOURCES -eq 'true')
